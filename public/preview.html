round:#f6f7f2}.side-bottom{margin-top:auto;background:#f7f8f3;border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:32px}.side-bottom strong{font-size:12px}.side-bottom p{font-size:11px;color:var(--muted);margin:7px 0 0}.main{padding:34px clamp(18px,3vw,44px);max-width:1600px;width:100%;margin:0 auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px}.eyebrow{color:#71806f;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px;margin:0 0 7px}.pagehead h1{font-size:clamp(25px,3vw,34px);line-height:1.15;letter-spacing:-1.2px;margin:0;font-weight:850}.subtitle{color:var(--muted);margin:9px 0 0;font-size:13px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:750;color:var(--ink);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}.btn.small{padding:7px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#edf4eb;font-size:17px}.stat strong{display:block;font-size:31px;letter-spacing:-1.3px;margin-top:12px;line-height:1.1}.trend{font-size:11px;color:#47805b;margin-top:9px}.content-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr);gap:18px;margin-top:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);min-width:0}.panel-head{padding:19px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid # splay:flex;gap:4px;background:#f1f3ed;padding:4px;border-radius:12px}.switcher button{border:0;background:transparent;border-radius:9px;padding:9px 14px;color:#758074;font-size:12px;font-weight:800}.switcher button.active{background:#fff;color:var(--green);box-shadow:0 2px 7px #1c38220b}.driver-hero{background:var(--green);color:#fff;border-radius:20px;padding:25px;display:flex;justify-content:space-between;gap:18px;align-items:center;position:relative;overflow:hidden}.driver-hero:after{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff19;border-radius:50%;right:12%;top:-140px;box-shadow:0 0 0 25px #ffffff08,0 0 0 52px #ffffff06}.driver-hero h2{margin:0;font-size:23px;letter-spacing:-.6px}.driver-hero p{color:#d5e2d5;margin:8px 0 0;font-size:12px}.hero-number{font-size:36px;font-weight:850;letter-spacing:-1px}.hero-number small{display:block;font-size:10px;font-weight:650;letter-spacing:.6px;color:#d5e2d5;text-transform:uppercase;text-align:right}.driver-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:16px 0 20px}.driver-metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.driver-metric span{display:block;color:var(--muted);font-size:11px}.driver-metric strong{display:block;font-size:23px;margin-top:5px}.route-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.mapbox{height:240px;background:#edf1e7;border-radius:13px;position:relative;overflow:hidden;border:1px solid #e0e6d9}.mapbox:before,.mapbox:after{content:"";position:absolute;inset:-50px;background:repeating-linear-gradient(28deg,transparent 0 35px,#fff 36px 41px,transparent 42px 70px);transform:rotate(-8deg)}.mapbox:after{background:repeating-linear-gradient(112deg,transparent 0 48px,#fff 49px 54px,transparent 55px 90px);transform:rotate(4deg);opacity:.8}.river{position:absolute;z-index:1;left:43%;top:-20%;width:65px;height:150%;background:#d5e6df;transform:rotate(18deg);border-radius:50%}.map-road{position:absolute;z-index:2;left:8%;top:55%;width:83%;height:4px;background:#e8b36e;transform:rotate(-18deg);border-radius:10px}.map-pin{position:absolute;z-index:3;width:29px;height:29px;background:var(--green);border:3px solid #fff;border-radius:50% 50% 50% 8%;transform:rotate(-45deg);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800;box-shadow:0 3px 8px #223d2833}.map-pin span{transform:rotate(45deg)}.pin-a{left:14%;top:63%}.pin-b{left:36%;top:51%}.pin-c{left:58%;top:42%}.pin-d{right:9%;top:23%;background:var(--orange)}.map-legend{position:absolute;z-index:4;left:12px;bottom:11px;background:#ffffffed;padding:7px 10px;border-radius:8px;font-size:10px;font-weight:800}.stop-list{display:grid;gap:0}.stop{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;padding:15px 0;border-bottom:1px solid #f0f1ec;align-items:start}.stop:last-child{border-bottom:0;padding-bottom:0}.stop-number{width:31px;height:31px;border-radius:11px;background:#edf3e9;color:var(--green);font-weight:850;display:grid;place-items:center}.stop.done .stop-number{background:#dceede}.stop strong{font-size:12px}.stop p{font-size:11px;color:var(--muted);margin:3px 0 0}.stop .stop-meta{font-size:10px;color:#9aa49a;margin-top:6px}.stop-actions{display:grid;gap:6px;justify-items:end}.role-note{margin-top:20px;font-size:11px;color:#8a9588;text-align:center}.toast{position:fixed;right:20px;bottom:20px;background:#193e30;color:#fff;padding:12px 17px;border-radius:12px;box-shadow:0 10px 30px #152d1d30;z-index:20}.hide{display:none!important}.mobile-menu{display:none}

<body>
<div class="app">

<script>
const $=s=>document.querySelector(s);
let role="admin",section="dashboard";
const deliveries=[
 {code:"DD-1048",name:"Aarav Mehta",area:"Kothrud",driver:"Rohan P.",time:"12:15 PM",status:"Delivered",meal:"Lunch"},
 {code:"DD-1049",name:"Priya Shah",area:"Karve Nagar",driver:"Rohan P.",time:"12:30 PM",status:"On the way",meal:"Lunch"},
 {code:"DD-1050",name:"Neha Kulkarni",area:"Erandwane",driver:"Sahil J.",time:"12:45 PM",status:"Preparing",meal:"Lunch"},
 {code:"DD-1051",name:"Ishaan Desai",area:"Deccan",driver:"Sahil J.",time:"1:00 PM",status:"Pending",meal:"Lunch"},
 {code:"DD-1052",name:"Mira Joshi",area:"Baner",driver:"Unassigned",time:"1:15 PM",status:"Pending",meal:"Lunch"}
];
const navAdmin=[["dashboard","▦","Overview"],["customers","♙","Customers"],["drivers","♧","Delivery team"],["deliveries","▤","Deliveries"],["history","◷","History & reports"],["settings","⚙","Settings"]];
const navDriver=[["route","⌁","My route"],["profile","♙","My profile"]];
const icons={dashboard:"◫",customers:"♙",drivers:"♧",deliveries:"▤",history:"◷",settings:"⚙",route:"⌁",profile:"♙"};
function setRole(next){role=next;section=role==="admin"?"dashboard":"route";$("#avatar").textContent=role==="admin"?"AM":"RP";render()}
function renderNav(){const nav=role==="admin"?navAdmin:navDriver;$("#nav").innerHTML='<div class="switcher" style="margin:0 3px 18px"><button class="'+(role==="admin"?"active":"")+'" id="adminSwitch">Admin</button><button class="'+(role==="driver"?"active":"")+'" id="driverSwitch">Driver</button></div>'+nav.map(([id,ico,label])=>'<button class="'+(section===id?"active":"")+'" data-section="'+id+'"><span class="ico">'+ico+'</span>'+label+'</button>').join("");$("#adminSwitch").onclick=()=>setRole("admin");$("#driverSwitch").onclick=()=>setRole("driver");document.querySelectorAll("[data-section]").forEach(b=>b.onclick=()=>{section=b.dataset.section;render()})}
function badge(status){let c=status==="Delivered"?"green":status==="On the way"?"blue":status==="Preparing"?"amber":"red";return '<span class="badge '+c+'">'+status+'</span>'}
function table(rows){return '<div class="table-wrap"><table><thead><tr><th>Delivery</th><th>Customer</th><th>Driver</th><th>Time</th><th>Status</th></tr></thead><tbody>'+rows.map(d=>'<tr><td><strong>'+d.code+'</strong></td><td><div class="person"><div class="mini-avatar">'+d.name.split(" ").map(n=>n[0]).join("")+'</div><div><strong>'+d.name+'</strong><small>'+d.area+'</small></div></div></td><td>'+d.driver+'</td><td>'+d.time+'</td><td>'+badge(d.status)+'</td></tr>').join("")+'</tbody></table></div>'}
function pageHead(kicker,title,subtitle,action){return '<div class="pagehead"><div><p class="eyebrow">'+kicker+'</p><h1>'+title+'</h1><p class="subtitle">'+subtitle+'</p></div>'+(action||"")+'</div>'}
function adminDashboard(){return pageHead("Sunday · Today at a glance","Good morning, Admin 👋","Here’s what’s happening with your tiffin deliveries today.",'<div class="actions"><button class="btn" onclick="toast(\'Report preview ready\')">↗ Export report</button><button class="btn primary" onclick="toast(\'New delivery form preview\')">＋ New delivery</button></div>')+'<div class="stats"><div class="stat"><div class="stat-top">Total deliveries <span class="stat-icon">🥡</span></div><strong>128</strong><div class="trend">↑ 12% <span style="color:#879387">vs. yesterday</span></div></div><div class="stat"><div class="stat-top">Delivered <span class="stat-icon">✓</span></div><strong>86</strong><div class="trend">67% of today’s orders</div></div><div class="stat"><div class="stat-top">In progress <span class="stat-icon">⌁</span></div><strong>29</strong><div class="trend" style="color:#b17a2f">14 stops still on the way</div></div><div class="stat"><div class="stat-top">Active drivers <span class="stat-icon">♧</span></div><strong>8<span style="font-size:14px;color:#93a091"> / 10</span></strong><div class="trend">2 drivers off duty</div></div></div><div class="content-grid"><section class="panel"><div class="panel-head"><div><h2>Today’s deliveries</h2><p>Live operations · Sample records</p></div><button class="btn small" onclick="section=\'deliveries\';render()">View all ↗</button></div>'+table(deliveries)+'</section><div class="right-stack"><section class="panel"><div class="panel-head"><div><h2>Delivery progress</h2><p>128 scheduled deliveries</p></div><span class="badge green">On track</span></div><div class="panel-body"><div class="progress-row"><span class="progress-label">Delivered</span><div class="progress-track"><div class="progress-fill" style="width:67%"></div></div><span class="progress-count">86</span></div><div class="progress-row"><span class="progress-label">On the way</span><div class="progress-track"><div class="progress-fill" style="width:23%;background:#e7a35d"></div></div><span class="progress-count">29</span></div><div class="progress-row"><span class="progress-label">Pending</span><div class="progress-track"><div class="progress-fill" style="width:10%;background:#aeb9ac"></div></div><span class="progress-count">13</span></div></div></section><section class="panel"><div class="panel-head"><div><h2>Recent activity</h2><p>Latest team updates</p></div></div><div class="panel-body activity"><div class="activity-item"><span class="activity-dot"></span><div><strong>Rohan completed a delivery</strong><p>Aarav Mehta · Kothrud</p><time>2 minutes ago</time></div></div><div class="activity-item"><span class="activity-dot" style="background:#7199bf;box-shadow:0 0 0 4px #e8f1f9"></span><div><strong>Route assigned to Sahil</strong><p>12 stops · Erandwane & Deccan</p><time>18 minutes ago</time></div></div><div class="activity-item"><span class="activity-dot" style="background:#6f9b72;box-shadow:0 0 0 4px #e5f1e4"></span><div><strong>New customer added</strong><p>Mira Joshi · Baner</p><time>34 minutes ago</time></div></div></div></section></div></div>'}
function driverPage(){const stops=[{n:1,name:"Aarav Mehta",area:"Kothrud · Paud Road",addr:"Near City Pride, building B",time:"12:15 PM",status:"Delivered"},{n:2,name:"Priya Shah",area:"Karve Nagar",addr:"Lane 4, near the garden",time:"12:30 PM",status:"On the way"},{n:3,name:"Neha Kulkarni",area:"Erandwane",addr:"Prabhat Road, flat 302",time:"12:45 PM",status:"Pending"},{n:4,name:"Ishaan Desai",area:"Deccan Gymkhana",addr:"Behind the bus stop",time:"1:00 PM",status:"Pending"}];return pageHead("Driver workspace","Your route, Rohan 🚲","Monday, 12 October · Keep every meal fresh and every delivery on time.",'<div class="actions"><button class="btn" onclick="toast(\'Route refreshed\')">↻ Refresh</button><button class="btn primary" onclick="toast(\'Opening navigation preview\')">⌁ Start navigation</button></div>')+'<div class="driver-hero"><div><p class="eyebrow" style="color:#d5e2d5">TODAY’S ROUTE</p><h2>You’re doing great, Rohan!</h2><p>4 stops assigned · 1 completed · Next stop in Karve Nagar</p></div><div class="hero-number">25%<small>route complete</small></div></div><div class="driver-metrics"><div class="driver-metric"><span>Assigned stops</span><strong>04</strong></div><div class="driver-metric"><span>Completed</span><strong>01</strong></div><div class="driver-metric"><span>Pending</span><strong>03</strong></div></div><div class="route-layout"><section class="panel"><div class="panel-head"><div><h2>Delivery stops</h2><p>Follow the route order · Sample addresses</p></div><span class="badge amber">3 remaining</span></div><div class="panel-body"><div class="stop-list">'+stops.map(s=>'<div class="stop '+(s.status==="Delivered"?"done":"")+'"><div class="stop-number">'+(s.status==="Delivered"?"✓":s.n)+'</div><div><strong>'+s.name+'</strong><p>'+s.area+'</p><p class="stop-meta">◷ '+s.time+' · '+s.addr+'</p></div><div class="stop-actions">'+badge(s.status)+(s.status!=="Delivered"?'<button class="btn small" onclick="markDone('+s.n+')">Mark delivered</button>':'')+'</div></div>').join("")+'</div></div></section><div class="right-stack"><section class="panel"><div class="panel-head"><div><h2>Route overview</h2><p>Illustrative route map</p></div><span class="badge green">4 stops</span></div><div class="panel-body"><div class="mapbox"><div class="river"></div><div class="map-road"></div><div class="map-pin pin-a"><span>1</span></div><div class="map-pin pin-b"><span>2</span></div><div class="map-pin pin-c"><span>3</span></div><div class="map-pin pin-d"><span>4</span></div><div class="map-legend">⌁ Kothrud → Karve Nagar → Deccan</div></div><p class="subtitle">Map is a visual placeholder, not live navigation.</p></div></section><section class="panel"><div class="panel-head"><div><h2>Before you go</h2><p>Quick delivery checklist</p></div></div><div class="panel-body activity"><div class="activity-item"><span class="activity-dot" style="background:#6f9b72;box-shadow:0 0 0 4px #e5f1e4"></span><div><strong>Check your tiffin count</strong><p>Make sure all meals are packed.</p></div></div><div class="activity-item"><span class="activity-dot"></span><div><strong>Capture delivery proof</strong><p>Photo confirmation keeps every order accounted for.</p></div></div></div></section></div></div>'}
function simplePage(){const titles={customers:["Customer directory","Keep customer details and delivery preferences in one place."],drivers:["Your delivery team","Manage staff access, shifts and driver assignments."],deliveries:["All deliveries","Track today’s orders from kitchen to doorstep."],history:["History & reports","Review completed orders and export delivery summaries."],settings:["Workspace settings","Configure the operational preferences for your team."],profile:["My profile","Update your staff profile and account security."]};const [title,sub]=titles[section]||titles.settings;let body='';if(section==="customers")body='<div class="panel"><div class="panel-head"><h2>Customers · 246 active</h2><button class="btn primary" onclick="toast(\'Add customer form preview\')">＋ Add customer</button></div>'+table([{...deliveries[0],code:"CUS-0148",driver:"Every weekday",status:"Active"},{...deliveries[1],code:"CUS-0149",driver:"Mon–Sat",status:"Active"},{...deliveries[2],code:"CUS-0150",driver:"Every day",status:"Paused"}])+'</div>';else if(section==="drivers")body='<div class="panel"><div class="panel-head"><h2>Delivery team · 10 members</h2><button class="btn primary" onclick="toast(\'Add driver form preview\')">＋ Add driver</button></div>'+table([{...deliveries[0],code:"DRV-001",name:"Rohan Patil",area:"Kothrud route",driver:"8 stops",status:"On duty"},{...deliveries[1],code:"DRV-002",name:"Sahil Jadhav",area:"Central route",driver:"12 stops",status:"On duty"},{...deliveries[2],code:"DRV-003",name:"Amit More",area:"—",driver:"Off today",status:"Pending"}])+'</div>';else if(section==="deliveries")body='<div class="panel"><div class="panel-head"><h2>Delivery queue</h2><button class="btn primary" onclick="toast(\'New delivery form preview\')">＋ New delivery</button></div>'+table(deliveries)+'</div>';else if(section==="history")body='<div class="stats"><div class="stat"><div class="stat-top">Completed this week</div><strong>642</strong><div class="trend">98.2% successful</div></div><div class="stat"><div class="stat-top">On-time rate</div><strong>96%</strong><div class="trend">↑ 2.4% this month</div></div><div class="stat"><div class="stat-top">Missed deliveries</div><strong>12</strong><div class="trend" style="color:#b17a2f">Needs review</div></div><div class="stat"><div class="stat-top">Avg. delivery time</div><strong>18m</strong><div class="trend">Per stop</div></div></div><div style="margin-top:18px"><button class="btn" onclick="toast(\'Report export preview\')">↓ Export CSV</button></div>';else body='<div class="panel"><div class="panel-head"><h2>Account & preferences</h2></div><div class="panel-body"><p class="subtitle">This is a visual preview only. Real settings will be connected to your staff account.</p><button class="btn" onclick="toast(\'Settings preview\')">Edit preferences</button></div></div>';return pageHead("Workspace",title,sub,'')+body}
function markDone(n){toast("Sample stop "+n+" marked delivered — preview only")}
function toast(msg){let t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2400)}
function render(){renderNav();$("#main").innerHTML=role==="admin"?(section==="dashboard"?adminDashboard():simplePage()):(section==="route"?driverPage():simplePage());}
render();
</script>
